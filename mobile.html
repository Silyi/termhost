<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- Standalone (fullscreen, no browser address bar) when added to the home screen -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="termhost" />
  <meta name="theme-color" content="#0b0b0d" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>termhost</title>
  <!-- Telegram Mini App SDK — defines window.Telegram.WebApp when the page
       runs inside Telegram. Loaded ONLY inside Telegram: a synchronous load of
       telegram.org hangs the whole page on networks where that host is blocked
       (the browser waits for the request to time out, so the load never finishes). -->
  <script>
    if (/Telegram/i.test(navigator.userAgent)) {
      var s = document.createElement('script');
      s.src = 'https://telegram.org/js/telegram-web-app.js';
      s.async = true;
      document.head.appendChild(s);
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/mobile/main.tsx"></script>
</body>
</html>
